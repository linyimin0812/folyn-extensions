<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paste History</title>
  <style>
    :root {
      color-scheme: light dark;
      --pane-head-h: 40px; /* shared by .viewer-head and .side-head so their borders align */
      --side-w: 250px; /* right column width; JS overrides at runtime while dragging / from saved prefs */
      --bg: #ffffff;
      --fg: #1b1b1f;
      --muted: #6b6b73;
      --line: #e3e3e8;
      --pane-bg: #fbfbfd;
      --sel-bg: rgba(80, 120, 255, .14);
      --sel-fg: #2456d8;
      --danger: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16161a;
        --fg: #e6e6ea;
        --muted: #9a9aa3;
        --line: #2a2a30;
        --pane-bg: #1c1c22;
        --sel-bg: rgba(120, 155, 255, .22);
        --sel-fg: #a8c2ff;
        --danger: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    header h1 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    header h1 .h-ico { display: inline-flex; flex: 0 0 auto; }
    header h1 .h-ico svg { width: 16px; height: 16px; display: block; }
    header .spacer { flex: 1; }
    header .status, header .err {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    header .err { color: var(--danger); }
    header .count { font-size: 11px; color: var(--muted); white-space: nowrap; }
    button {
      font: inherit;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: var(--pane-bg); }
    button.danger { border-color: var(--danger); color: var(--danger); }

    .row { display: flex; flex: 1 1 0; min-height: 0; }

    /* left column — main viewer */
    .viewer {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--pane-bg);
    }
    .viewer-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      height: var(--pane-head-h);
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .viewer-head .info {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .viewer-head .spacer { flex: 1; }
    .viewer-body { flex: 1 1 0; min-height: 0; overflow: auto; }
    .viewer-body.center { display: flex; }
    /* margin:auto centers while staying reachable when scrolled */
    .viewer-body canvas { margin: auto; max-width: 100%; max-height: 100%; }
    .viewer-body pre.text {
      margin: 0;
      padding: 12px 14px;
      font: 12px/1.6 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      tab-size: 4;
    }

    /* draggable divider between the panes — replaces .side's old border */
    .splitter {
      flex: 0 0 6px;
      cursor: col-resize;
      position: relative;
      background: transparent;
    }
    .splitter::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--line);
    }
    .splitter:hover::after,
    .splitter.dragging::after { background: var(--sel-fg); }
    body.resizing { user-select: none; cursor: col-resize; }

    /* right column — history list.
       flex:none + width (NOT flex-basis in a shorthand with var()) plus an
       EXPLICIT min-width:0 — without it the flex item's automatic minimum
       (min-content of the row's nowrap preview text) hijacks the width:
       short copies → narrow, long copies → wide, and the splitter drag is
       clamped by the content (all observed). overflow:hidden is the
       belt-and-braces guarantee the column never outgrows --side-w. */
    .side {
      flex: none;
      width: var(--side-w);
      min-width: 0;
      max-width: 65%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .side-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      height: var(--pane-head-h);
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .side-head .side-ico { display: inline-flex; flex: 0 0 auto; }
    .side-head .side-ico svg { width: 16px; height: 16px; display: block; }
    .list { flex: 1 1 0; overflow-y: auto; overflow-x: hidden; min-height: 0; }
    .item {
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .item:hover { background: var(--pane-bg); }
    .item.sel { background: var(--sel-bg); }
    .item.sel .prev { color: var(--sel-fg); }
    .item .ico { flex: 0 0 auto; display: inline-flex; }
    .item .ico svg { width: 16px; height: 16px; display: block; }
    .item .meta { flex: 1 1 0; min-width: 0; }
    .item .prev {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item .ts { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* per-row hover actions (copy / delete) — icons, hidden until hover */
    .item .act {
      flex: 0 0 auto;
      display: inline-flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .item:hover .act,
    .item:focus-within .act { opacity: 1; }
    .item .act button {
      appearance: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 3px;
      border-radius: 4px;
      color: var(--muted);
      display: inline-flex;
      line-height: 0;
    }
    .item .act button:hover { color: var(--sel-fg); background: var(--sel-bg); }
    .item .act button.act-del:hover { color: var(--danger); }
    .item .act svg { width: 14px; height: 14px; display: block; }

    .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 24px 12px; }
    .viewer-body .empty { margin: auto; }
  </style>
</head>
<body>
  <div id="app" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0;"></div>
  <script src="./index.js"></script>
</body>
</html>
