<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diff Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1b1b1f;
      --muted: #6b6b73;
      --line: #e3e3e8;
      --pane-bg: #fbfbfd;
      --add-bg: #cdedd6;
      --add-fg: #0a6b2f;
      --del-bg: #fbd5d5;
      --del-fg: #8a1f1f;
      --sel: rgba(80, 120, 255, .28);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16161a;
        --fg: #e6e6ea;
        --muted: #9a9aa3;
        --line: #2a2a30;
        --pane-bg: #1c1c22;
        --add-bg: #1f4a2e;
        --add-fg: #8ff0a8;
        --del-bg: #4a1f1f;
        --del-fg: #f0a8a8;
        --sel: rgba(120, 155, 255, .30);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    header h1 { font-size: 13px; font-weight: 600; margin: 0; }
    header .spacer { flex: 1; }
    header button {
      font: inherit;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
    }
    header button:hover { background: var(--pane-bg); }
    .stats { font-size: 11px; color: var(--muted); }
    .stats .n-add { color: var(--add-fg); }
    .stats .n-del { color: var(--del-fg); }
    .row {
      display: flex;
      gap: 1px;
      background: var(--line);
      flex: 1 1 0;
      min-height: 0;
    }
    .pane {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--pane-bg);
      min-height: 0;
    }
    .pane label {
      padding: 4px 10px;
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .editor {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
    }
    /* backdrop and textarea share exact typography so highlights line up */
    .editor .backdrop, .editor textarea {
      position: absolute;
      inset: 0;
      margin: 0;
      border: 0;
      padding: 8px 10px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      white-space: pre;
      tab-size: 4;
      overflow: auto;
    }
    .editor .backdrop {
      pointer-events: none;
      color: var(--fg);
      z-index: 0;
      background: transparent;
      overflow: hidden;
    }
    .editor textarea {
      background: transparent;
      color: transparent;
      caret-color: var(--fg);
      resize: none;
      outline: 0;
      z-index: 1;
    }
    .editor textarea::selection { background: var(--sel); }
    .add { background: var(--add-bg); color: var(--add-fg); border-radius: 2px; }
    .del { background: var(--del-bg); color: var(--del-fg); border-radius: 2px; text-decoration: line-through; }
  </style>
</head>
<body>
  <div id="app" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0;"></div>
  <script src="./index.js"></script>
</body>
</html>
